<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1f2b"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#ff9550"/>
      <stop offset="55%" stop-color="#ff6b1a"/>
      <stop offset="100%" stop-color="#e04d05"/>
    </radialGradient>
    <clipPath id="ballClip"><circle cx="512" cy="470" r="316"/></clipPath>
  </defs>

  <!-- fond -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- arceau doré stylisé derrière le ballon -->
  <ellipse cx="512" cy="700" rx="330" ry="64" fill="none" stroke="#f5b94b" stroke-width="26" opacity="0.9"/>

  <!-- ballon -->
  <g>
    <circle cx="512" cy="470" r="316" fill="url(#ball)"/>
    <!-- coutures (rognées au contour du ballon) -->
    <g clip-path="url(#ballClip)" stroke="#14161b" stroke-width="22" fill="none" stroke-linecap="round">
      <!-- verticale courbée -->
      <path d="M 512 154 C 400 300 400 640 512 786"/>
      <!-- horizontale -->
      <path d="M 196 470 L 828 470"/>
      <!-- arcs latéraux -->
      <path d="M 268 250 C 420 380 420 560 268 690"/>
      <path d="M 756 250 C 604 380 604 560 756 690"/>
    </g>
    <!-- contour du ballon -->
    <circle cx="512" cy="470" r="316" fill="none" stroke="#14161b" stroke-width="22"/>
  </g>

  <!-- avant de l'arceau, par-dessus le bas du ballon -->
  <path d="M 182 700 A 330 64 0 0 0 842 700" fill="none" stroke="#f5b94b" stroke-width="26"/>
</svg>
